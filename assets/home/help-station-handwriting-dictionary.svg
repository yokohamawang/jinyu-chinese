<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" role="img" aria-labelledby="title desc">
<title id="title">Handwriting dictionary</title>
<desc id="desc">A Chinese character written with a brush is enlarged by a magnifying glass on a dictionary page</desc>
<defs>
  <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39b9a4"/><stop offset="1" stop-color="#087b78"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#fffef7"/><stop offset="1" stop-color="#e8f5e9"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8fbf2"/><stop offset="1" stop-color="#a4e5d6"/></linearGradient>
  <linearGradient id="brush" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7d77c"/><stop offset=".48" stop-color="#fff1bd"/><stop offset="1" stop-color="#e3a94b"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#075b56" flood-opacity=".24"/></filter>
</defs>
<!-- landscape dictionary cover -->
<rect x="3" y="3" width="194" height="114" rx="27" fill="url(#cover)" stroke="#e2fff5" stroke-width="2"/>
<path d="M17 17h151a13 13 0 0 1 13 13v60a13 13 0 0 1-13 13H17a8 8 0 0 1-8-8V25a8 8 0 0 1 8-8Z" fill="url(#paper)" filter="url(#shadow)"/>
<!-- visible dictionary index tabs -->
<path d="M164 28h17v15h-17z" fill="#f5c969"/><path d="M164 46h17v15h-17z" fill="#ef927c"/><path d="M164 64h17v15h-17z" fill="#8ed4b6"/>
<!-- dictionary label -->
<rect x="20" y="24" width="48" height="17" rx="8.5" fill="#117f78"/>
<text x="44" y="36" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" letter-spacing="1" fill="#fff">字典</text>
<!-- handwriting practice grid and bold headword -->
<rect x="23" y="46" width="99" height="54" rx="10" fill="#e3f4ec" stroke="#9bd0bc" stroke-width="1.5"/>
<path d="M72.5 48v50M25 73h95" stroke="#a8d8c7" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="73" y="90" text-anchor="middle" font-family="Noto Serif CJK JP, Noto Sans CJK JP, serif" font-size="43" font-weight="700" fill="#145e55">手</text>
<!-- bamboo stylus actively writing the character -->
<g transform="rotate(36 106 34)" stroke-linejoin="round">
  <path d="M100 9h12v46l-6 12-6-12Z" fill="url(#brush)" stroke="#9b7135" stroke-width="1.8"/>
  <path d="M100 20h12M100 25h12" stroke="#d7a84d" stroke-width="2"/>
  <path d="M100 55h12l-6 12Z" fill="#325b4e"/>
  <path d="M103 57h6" stroke="#f5ead0" stroke-width="1.2"/>
</g>
<!-- magnifier: handwritten character becomes a dictionary lookup -->
<circle cx="146" cy="76" r="25" fill="#fff" stroke="#117f78" stroke-width="6"/>
<circle cx="146" cy="76" r="19.5" fill="url(#glass)" stroke="#d5fff2" stroke-width="1.5"/>
<text x="146" y="86" text-anchor="middle" font-family="Noto Serif CJK JP, Noto Sans CJK JP, serif" font-size="28" font-weight="700" fill="#12675d">手</text>
<path d="m164 94 20 17" stroke="#f2c35f" stroke-width="9" stroke-linecap="round"/>
<path d="m164 94 20 17" stroke="#fff2bf" stroke-width="3" stroke-linecap="round"/>
<!-- sparkle at the point of lookup -->
<path d="m138 46 2-6m-9 11-5-2m31 2 4-4" stroke="#f0bb4d" stroke-width="2.5" stroke-linecap="round"/>
</svg>
