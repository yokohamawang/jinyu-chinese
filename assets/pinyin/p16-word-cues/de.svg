<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
<title>馬が走るひづめの音</title>
<defs>
 <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffef9"/><stop offset="1" stop-color="#f5f7eb"/></linearGradient>
 <linearGradient id="coat" x1=".14" y1=".15" x2=".84" y2=".9"><stop stop-color="#efbd72"/><stop offset=".52" stop-color="#c67b3d"/><stop offset="1" stop-color="#95502f"/></linearGradient>
 <linearGradient id="neck" x1=".1" y1=".1" x2=".9" y2=".9"><stop stop-color="#f5cc82"/><stop offset=".55" stop-color="#d38a49"/><stop offset="1" stop-color="#a35a34"/></linearGradient>
 <linearGradient id="mane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#74402f"/><stop offset="1" stop-color="#422c2a"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6a5035" flood-opacity=".2"/></filter>
</defs>
<rect x="6" y="6" width="168" height="168" rx="27" fill="url(#tile)" stroke="#dce7d9" stroke-width="3"/>
<!-- soft ground and hoofbeat dust -->
<ellipse cx="93" cy="149" rx="65" ry="8" fill="#dce8d5"/>
<path d="M27 137c5-8 12-8 16 0 3-6 9-6 12 0m76 1c4-8 11-8 15 0 3-6 9-5 12 1" fill="none" stroke="#e7c58e" stroke-width="4" stroke-linecap="round" opacity=".8"/>
<g fill="#f0d9a9" opacity=".85"><circle cx="39" cy="126" r="5"/><circle cx="48" cy="121" r="3"/><circle cx="137" cy="121" r="4"/><circle cx="148" cy="126" r="3"/><circle cx="58" cy="133" r="2.5"/><circle cx="127" cy="133" r="2.5"/></g>
<!-- flowing tail -->
<path d="M50 91c-9-8-19-10-25-4 7 0 10 4 12 8-8-2-14 1-17 7 9-4 16-1 21 5 4-5 8-9 14-10Z" fill="url(#mane)" stroke="#54362c" stroke-width="2.5" stroke-linejoin="round"/>
<!-- rear legs, stretched back in a gallop -->
<g stroke="#75452e" stroke-width="2.5" stroke-linejoin="round">
 <path d="M60 103c-5 10-11 18-20 24l-9 3-4 8 13 1c9-5 17-11 23-19l9-10Z" fill="url(#neck)"/>
 <path d="M75 108c-1 10-8 19-15 27l-2 8 12 2 8-8c5-8 10-14 14-19l-1-10Z" fill="url(#coat)"/>
 <path d="m28 131-9 3-3 7 14 2 5-4-1-6Z" fill="#4c382e"/>
 <path d="m59 140-3 7 13 2 6-4-2-6Z" fill="#4c382e"/>
</g>
<!-- forelegs reaching forward -->
<g stroke="#75452e" stroke-width="2.5" stroke-linejoin="round">
 <path d="M111 101c10 4 19 4 29 0l9-11 8 1-2 13c-9 12-22 17-38 15l-9-8Z" fill="url(#neck)"/>
 <path d="M105 108c9 7 16 15 20 24l8 7 10-4-4-9c-5-12-12-20-21-26Z" fill="url(#coat)"/>
 <path d="m153 89 8 1 2 6-7 4-8-3Z" fill="#4c382e"/>
 <path d="m131 136 8-4 7 4-3 7-10 2-5-4Z" fill="#4c382e"/>
</g>
<!-- body -->
<g>
 <path d="M43 83c8-12 25-17 47-15 19 1 34 9 38 21 3 10-4 21-17 27-17 8-43 8-61 0-15-6-20-20-7-33Z" fill="url(#coat)" stroke="#87512f" stroke-width="3"/>
 <path d="M53 84c12-9 32-12 50-8 10 2 17 6 21 12-13-5-24-6-34-4-14 2-25 8-34 16-5-4-7-10-3-16Z" fill="#f2c781" opacity=".68"/>
 <!-- arched neck -->
 <path d="M99 91c5-17 12-33 24-43 8-6 18-5 23 1 4 5 1 12-4 17l-9 9-5 24c-7 9-17 15-29 16Z" fill="url(#neck)" stroke="#87512f" stroke-width="3"/>
 <!-- head and long muzzle -->
 <path d="M122 52c2-8 9-14 17-15 7-1 12 4 12 10 0 4-3 7-7 10 7 0 13 3 15 7-2 5-8 7-16 6l-9-2-7 8-10-6Z" fill="url(#neck)" stroke="#87512f" stroke-width="3" stroke-linejoin="round"/>
 <!-- ears -->
 <path d="m126 44-1-14c8 3 12 7 13 13m5-1 5-12c5 7 6 12 3 17" fill="#c77d43" stroke="#87512f" stroke-width="2.5" stroke-linejoin="round"/>
 <!-- mane and forelock -->
 <path d="M103 80c-1-14 2-26 9-36l7 2 2-11 8 6 5-10 6 12c-4 11-12 18-17 27l-7 17Z" fill="url(#mane)" stroke="#54362c" stroke-width="2.5" stroke-linejoin="round"/>
 <path d="M132 43c5-5 12-6 18-2-5 1-8 4-10 8Z" fill="#54362c"/>
 <!-- friendly eye, nostril, cheek, muzzle highlight -->
 <ellipse cx="145" cy="49" rx="2.7" ry="3.2" fill="#fff8e9"/><circle cx="146" cy="49" r="1.5" fill="#3b2d2a"/>
 <circle cx="157" cy="61" r="1.5" fill="#71432f"/>
 <path d="M149 67c3 1 6 1 8-1" fill="none" stroke="#8b4b37" stroke-width="1.5" stroke-linecap="round"/>
 <path d="M132 56c-3 5-5 10-6 14" fill="none" stroke="#f5d59d" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</g>
<!-- rhythmic motion marks behind the galloping hooves -->
<path d="M22 113c5-4 10-5 15-3M20 119c6-3 11-3 16-1M143 112c6 1 10 3 13 7" fill="none" stroke="#78b5a1" stroke-width="3" stroke-linecap="round"/>
</svg>
