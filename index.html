<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>声調コーチ</title>
<style>
:root{--ink:#172033;--muted:#7d8799;--blue:#5b5cf0;--line:#e8eaf2;--green:#16a37b;--red:#e45572}*{box-sizing:border-box}body{margin:0;background:#eef0f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button{font-family:inherit}.phone{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding:18px 18px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 24px}.logo{font-weight:800;font-size:20px}.logo span{color:var(--blue)}.avatar{width:36px;height:36px;border-radius:50%;background:#ececff;display:grid;place-items:center;color:var(--blue);font-weight:700}.hero .eyebrow{font-size:13px;color:var(--muted)}.hero h1{font-size:27px;margin:8px 0}.hero h1 em{font-style:normal;color:var(--blue)}.hero p{font-size:14px;line-height:1.7;color:var(--muted)}.streak{display:flex;gap:12px;align-items:center;background:#f6f6ff;border:1px solid #e5e5ff;border-radius:18px;padding:14px 16px;margin:20px 0}.streak b{font-size:18px}.streak small{display:block;color:var(--muted);margin-top:3px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-head h2{font-size:17px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.flow{border:1px solid #dedfff;border-radius:22px;padding:18px;background:linear-gradient(145deg,#f7f7ff,#fff);box-shadow:0 10px 28px rgba(60,61,150,.08)}.flow-top{display:flex;justify-content:space-between;align-items:center}.tag{font-size:12px;color:var(--blue);background:#ececff;padding:6px 9px;border-radius:8px}.progress{font-size:12px;color:var(--muted)}.stage{text-align:center;font-size:15px;font-weight:800;margin:20px 0 6px}.sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:14px}.play{width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:14px;font-size:15px;font-weight:800}.choices,.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.choice,.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;font-size:13px;font-weight:750}.choice{font-size:14px;padding:14px 8px}.feedback,.status{display:none;margin-top:12px;border-radius:12px;padding:12px;font-size:13px;line-height:1.65}.show{display:block}.good{background:#edf9f5;color:#26735f}.bad{background:#fff3f5;color:#9c4054}.reveal{display:none;text-align:center;margin-top:16px}.reveal.show{display:block}.big-cn{font-size:42px;font-weight:850}.pinyin{color:var(--blue)}.tip{background:#fff7e8;border-radius:12px;padding:11px;margin-top:12px;font-size:12px;line-height:1.6;text-align:left}.listen{background:#eeeeff;color:var(--blue);border:0}.record{background:var(--blue);color:#fff;border:0}.record.recording{background:var(--red)}.next{width:100%;margin-top:10px}.next[disabled]{opacity:.4}.info{background:#f1f2ff;color:#5051aa}.ok{background:#edf9f5;color:#26735f}audio{width:100%;height:42px;margin-top:11px}.examples{display:grid;gap:9px}.example{border:1px solid var(--line);border-radius:16px;padding:13px 14px}.example-top{display:flex;justify-content:space-between}.jp{font-size:12px;color:var(--muted)}.level{font-size:10px;color:var(--green);background:#edf9f5;padding:4px 7px;border-radius:7px}.cn{font-size:20px;font-weight:800;margin:6px 0 2px}.example-buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.small-btn{border:1px solid #dedfff;background:#f8f8ff;color:var(--blue);border-radius:9px;padding:8px;font-size:11px;font-weight:700}.score{text-align:center;padding:20px 8px}.score strong{font-size:38px;color:var(--blue)}
</style></head><body><main class="phone">
<header class="top"><div class="logo">声調<span>コーチ</span> <small style="font-size:10px;color:#16a37b">DEMO 3</small></div><div class="avatar">A</div></header>
<section class="hero"><p class="eyebrow">日本人のための中国語発音トレーニング</p><h1>中国語、<em>通じる発音</em>へ。</h1><p>聞き分けて、答えて、自分でも発音。1問ずつ声調を身につけましょう。</p></section>
<section class="streak"><div style="font-size:25px">🔥</div><div><b>今日の3分チャレンジ</b><small>5問をひとつの流れで練習</small></div></section>
<div class="section-head"><h2>🎯 今日のチャレンジ</h2><span id="count">1 / 5</span></div>
<section class="flow" id="flow"><div class="flow-top"><span class="tag" id="phaseTag">① 聞き分け</span><span class="progress" id="dots">○ ○ ○ ○ ○</span></div><div id="quiz"><div class="stage">音声を聞いて、意味を選ぼう</div><div class="sub">漢字は答えたあとに表示されます</div><button class="play" onclick="playQuestion()">🔊 音声を聞く</button><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div></div><div class="reveal" id="reveal"><div class="big-cn" id="cn"></div><div class="pinyin" id="py"></div><div class="sub" id="jp"></div><div class="tip" id="tip"></div><div class="actions"><button class="btn listen" onclick="playQuestion()">🔊 標準音声</button><button class="btn record" id="recordBtn" onclick="toggleRecording()">🎙 録音する</button></div><div id="audioArea"></div><div class="status" id="status"></div><button class="btn next" id="nextBtn" onclick="nextQuestion()">次の問題 →</button></div></section>
<div class="section-head"><h2>基本例文20</h2><span>自由練習</span></div><section class="examples" id="examples"></section>
</main><script>
const bank=[
{cn:'买',py:'mǎi · 3声',jp:'買う',choices:['🛒 買う','🏷️ 売る'],answer:'🛒 買う',tip:'3声：低く下げてから、最後を少し上げます。'},
{cn:'卖',py:'mài · 4声',jp:'売る',choices:['🛒 買う','🏷️ 売る'],answer:'🏷️ 売る',tip:'4声：高い位置から一気に下げます。'},
{cn:'水',py:'shuǐ · 3声',jp:'水',choices:['💧 水','😴 寝る'],answer:'💧 水',tip:'3声。低い位置をしっかり意識します。'},
{cn:'睡',py:'shuì · 4声',jp:'寝る',choices:['💧 水','😴 寝る'],answer:'😴 寝る',tip:'4声。「水」と違って一気に下げます。'},
{cn:'问',py:'wèn · 4声',jp:'尋ねる',choices:['❓ 尋ねる','💋 キスする'],answer:'❓ 尋ねる',tip:'问 wèn は4声。吻 wěn（キスする）は3声です。'},
{cn:'吻',py:'wěn · 3声',jp:'キスする',choices:['❓ 尋ねる','💋 キスする'],answer:'💋 キスする',tip:'吻 wěn は3声。问 wèn（尋ねる）は4声です。'},
{cn:'汤',py:'tāng · 1声',jp:'スープ',choices:['🥣 スープ','🍬 砂糖'],answer:'🥣 スープ',tip:'1声：高い位置を平らに保ちます。'},
{cn:'糖',py:'táng · 2声',jp:'砂糖',choices:['🥣 スープ','🍬 砂糖'],answer:'🍬 砂糖',tip:'2声：低めから上へ滑らかに上げます。'}];
const examples=[['こんにちは。','あいさつ','你好！','nǐ hǎo'],['お元気ですか？','あいさつ','你好吗？','nǐ hǎo ma'],['私は日本人です。','自己紹介','我是日本人。','wǒ shì Rìběn rén'],['私の名前は橋本太郎です。','自己紹介','我叫桥本太郎。','wǒ jiào Qiáoběn Tàiláng'],['初めまして。','あいさつ','初次见面。','chūcì jiànmiàn'],['よろしくお願いします。','あいさつ','请多关照。','qǐng duō guānzhào'],['ありがとうございます。','基本表現','谢谢你。','xièxie nǐ'],['どういたしまして。','基本表現','不客气。','bú kèqi'],['すみません。','基本表現','对不起。','duìbuqǐ'],['大丈夫です。','基本表現','没关系。','méi guānxi'],['これは何ですか？','質問','这是什么？','zhè shì shénme'],['これはいくらですか？','買い物','这个多少钱？','zhège duōshao qián'],['これをください。','買い物','请给我这个。','qǐng gěi wǒ zhège'],['トイレはどこですか？','旅行','洗手间在哪里？','xǐshǒujiān zài nǎlǐ'],['駅はどこですか？','旅行','车站在哪里？','chēzhàn zài nǎlǐ'],['水を一杯ください。','レストラン','请给我一杯水。','qǐng gěi wǒ yì bēi shuǐ'],['これは辛いですか？','レストラン','这个辣吗？','zhège là ma'],['中国語を勉強しています。','学習','我在学习中文。','wǒ zài xuéxí Zhōngwén'],['中国語は難しいですが、面白いです。','学習','中文很难，但是很有意思。','Zhōngwén hěn nán, dànshì hěn yǒu yìsi'],['また明日会いましょう。','あいさつ','明天见。','míngtiān jiàn']];
let round=[],idx=0,score=0,answered=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function newRound(){round=shuffle(bank).slice(0,5).map(q=>({...q,choices:shuffle(q.choices)}));idx=0;score=0;render()}
function render(){answered=false;clearRecording();const q=round[idx];count.textContent=(idx+1)+' / 5';dots.textContent=round.map((_,i)=>i<idx?'●':'○').join(' ');phaseTag.textContent='① 聞き分け';quiz.style.display='block';reveal.className='reveal';feedback.className='feedback';feedback.innerHTML='';choices.innerHTML='';q.choices.forEach(label=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>answer(label);choices.appendChild(b)});cn.textContent=q.cn;py.textContent=q.py;jp.textContent=q.jp;tip.textContent='💡 '+q.tip;status.className='status';status.innerHTML='';recordBtn.textContent='🎙 録音する';nextBtn.textContent=idx===4?'結果を見る →':'次の問題 →'}
function answer(label){if(answered)return;answered=true;const q=round[idx],ok=label===q.answer;if(ok)score++;[...choices.children].forEach(b=>b.disabled=true);feedback.className='feedback show '+(ok?'good':'bad');feedback.innerHTML='<b>'+(ok?'🎉 正解！':'惜しい！')+'</b><br>'+q.cn+' '+q.py+' ＝ '+q.jp;phaseTag.textContent='② 発音してみよう';reveal.className='reveal show'}
let chineseVoice=null;function refreshVoices(){if(!('speechSynthesis'in window))return;const v=speechSynthesis.getVoices();chineseVoice=v.find(x=>/^zh-CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}if('speechSynthesis'in window){refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices}function speak(t){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();refreshVoices();const u=new SpeechSynthesisUtterance(t);u.lang=chineseVoice?chineseVoice.lang:'zh-CN';if(chineseVoice)u.voice=chineseVoice;u.rate=.78;speechSynthesis.speak(u)}function playQuestion(){speak(round[idx].cn)}
function nextQuestion(){if(isRecording){stopRecording();return}if(!answered)return;if(idx<4){idx++;render();document.getElementById('flow').scrollIntoView({behavior:'smooth',block:'start'})}else{showScore()}}
function showScore(){clearRecording();flow.innerHTML='<div class="score"><div>5問終了 🎉</div><strong>'+score+' / 5</strong><p>'+(score===5?'全問正解！次は別の5問に挑戦しましょう。':score>=3?'いい感じです。次の5問でも耳と発音をセットで練習しましょう。':'声調の違いを、聞く→話すの順で繰り返してみましょう。')+'</p><button class="play" onclick="location.reload()">もう一度チャレンジ</button></div>';count.textContent='完了'}
const examplesBox=document.getElementById('examples');examples.forEach((x,i)=>{const c=document.createElement('article');c.className='example';c.innerHTML='<div class="example-top"><div class="jp">'+x[0]+'</div><span class="level">'+x[1]+'</span></div><div class="cn">'+x[2]+'</div><div class="pinyin">'+x[3]+'</div><div class="example-buttons"><button class="small-btn" onclick="speak(examples['+i+'][2])">🔊 聞く</button><button class="small-btn" onclick="practiceExample('+i+')">🎙 練習</button></div>';examplesBox.appendChild(c)});function practiceExample(i){speak(examples[i][2]);alert('基本例文の録音練習は次の更新でチャレンジ画面に統合します。')}
let mediaRecorder=null,microphoneStream=null,chunks=[],recordedURL=null,isRecording=false,starting=false,autoStopTimer=null;function clearRecording(){if(typeof audioArea!=='undefined')audioArea.innerHTML='';if(recordedURL){URL.revokeObjectURL(recordedURL);recordedURL=null}}function releaseMicrophone(){if(microphoneStream){microphoneStream.getTracks().forEach(t=>{try{t.stop()}catch(e){}});microphoneStream=null}}async function toggleRecording(){if(isRecording){stopRecording();return}if(starting)return;const btn=recordBtn;if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){status.className='status info show';status.textContent='このブラウザでは録音機能を利用できません。';return}starting=true;btn.disabled=true;btn.textContent='🎙 準備中…';try{if('speechSynthesis'in window)speechSynthesis.cancel();releaseMicrophone();clearRecording();const stream=await navigator.mediaDevices.getUserMedia({audio:true});microphoneStream=stream;chunks=[];const recorder=new MediaRecorder(stream);mediaRecorder=recorder;recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{isRecording=false;releaseMicrophone();if(autoStopTimer){clearTimeout(autoStopTimer);autoStopTimer=null}btn.disabled=false;btn.classList.remove('recording');btn.textContent='🎙 もう一度録音';if(!chunks.length)return;const blob=new Blob(chunks,{type:recorder.mimeType||chunks[0].type||'audio/mp4'});if(!blob.size)return;recordedURL=URL.createObjectURL(blob);const a=document.createElement('audio');a.controls=true;a.src=recordedURL;audioArea.appendChild(a);status.className='status ok show';status.innerHTML='<b>✓ 録音できました！</b><br>自分の声と標準音声を聞き比べてみましょう。'};recorder.start();isRecording=true;starting=false;btn.disabled=false;btn.classList.add('recording');btn.textContent='■ 録音を停止';status.className='status info show';status.innerHTML='<b>● 録音中…</b><br>「'+round[idx].cn+'」と発音してみましょう。';autoStopTimer=setTimeout(()=>{if(recorder.state==='recording')stopRecording()},10000)}catch(e){starting=false;isRecording=false;releaseMicrophone();btn.disabled=false;btn.classList.remove('recording');btn.textContent='🎙 録音する';status.className='status info show';status.innerHTML='マイクを開始できませんでした。Safariのマイク許可を確認してください。'}}function stopRecording(){if(autoStopTimer){clearTimeout(autoStopTimer);autoStopTimer=null}if(mediaRecorder&&mediaRecorder.state==='recording'){try{mediaRecorder.stop()}catch(e){releaseMicrophone();isRecording=false}}else{releaseMicrophone();isRecording=false}}
window.addEventListener('pagehide',releaseMicrophone);newRound();
</script></body></html>
