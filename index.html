<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>声調コーチ</title><meta name="description" content="日本人のための中国語発音・声調練習アプリ">
<style>
:root{--ink:#172033;--muted:#7d8799;--blue:#5b5cf0;--soft:#f4f5ff;--line:#e8eaf2;--green:#16a37b;--red:#e45572;--gold:#f3a712}*{box-sizing:border-box}body{margin:0;background:#eef0f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button{font-family:inherit}.phone{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding:18px 18px 30px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 24px}.logo{font-weight:800;font-size:20px}.logo span{color:var(--blue)}.avatar{width:36px;height:36px;border-radius:50%;background:#ececff;display:grid;place-items:center;color:var(--blue);font-weight:700}.eyebrow{font-size:13px;color:var(--muted);margin:0 0 8px}.hero h1{font-size:27px;line-height:1.25;margin:0 0 10px}.hero h1 em{font-style:normal;color:var(--blue)}.hero p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 20px}.streak{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#f0efff,#fafaff);border:1px solid #e5e5ff;border-radius:18px;padding:14px 16px;margin-bottom:22px}.fire{font-size:25px}.streak b{font-size:18px}.streak small{display:block;color:var(--muted);margin-top:3px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-head h2{font-size:17px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.game,.challenge{border:1px solid #dedfff;border-radius:22px;padding:18px;background:linear-gradient(145deg,#f7f7ff,#fff);box-shadow:0 10px 28px rgba(60,61,150,.08)}.game-top,.challenge-top{display:flex;justify-content:space-between;align-items:center}.tag{font-size:12px;color:var(--blue);background:#ececff;padding:6px 9px;border-radius:8px}.progress{font-size:12px;color:var(--muted)}.game-title{text-align:center;font-size:15px;font-weight:800;margin:20px 0 6px}.game-sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:14px}.play-big{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:14px;font-size:15px;font-weight:800}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.choice{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font-size:14px;font-weight:750}.choice:disabled{opacity:.65}.feedback{display:none;margin-top:12px;border-radius:12px;padding:12px;font-size:13px;line-height:1.65}.feedback.show{display:block}.feedback.good{background:#edf9f5;color:#26735f}.feedback.bad{background:#fff3f5;color:#9c4054}.game-actions{display:none;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.game-actions.show{display:grid}.btn{border:0;border-radius:12px;padding:12px 8px;font-size:13px;font-weight:750;cursor:pointer}.listen{background:#eeeeff;color:var(--blue)}.next{background:#fff;border:1px solid var(--line);color:var(--ink)}.score{text-align:center;padding:12px}.score strong{font-size:34px;color:var(--blue)}.challenge-title{text-align:center;font-size:13px;color:var(--muted);margin-top:20px}.big-cn{text-align:center;font-size:38px;font-weight:850;margin:8px 0 4px}.big-pinyin{text-align:center;color:var(--blue);font-size:17px}.big-jp{text-align:center;font-size:13px;color:var(--muted);margin:7px 0 16px}.tip{background:#fff7e8;border-radius:12px;padding:11px 12px;font-size:12px;line-height:1.6;margin-bottom:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.record{background:var(--blue);color:#fff}.record.recording{background:var(--red);animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(.98);opacity:.82}}.status{display:none;margin-top:13px;border-radius:12px;padding:12px;font-size:13px;line-height:1.65}.status.show{display:block}.status.info{background:#f1f2ff;color:#5051aa}.status.ok{background:#edf9f5;color:#26735f}audio{width:100%;height:42px;margin-top:11px}.examples{display:grid;gap:9px}.example{border:1px solid var(--line);border-radius:16px;padding:13px 14px;background:#fff}.example-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.jp{font-size:12px;color:var(--muted)}.level{font-size:10px;color:var(--green);background:#edf9f5;padding:4px 7px;border-radius:7px;white-space:nowrap}.cn{font-size:20px;font-weight:800;margin:6px 0 2px}.pinyin{font-size:12px;color:var(--blue)}.example-buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.small-btn{border:1px solid #dedfff;background:#f8f8ff;color:var(--blue);border-radius:9px;padding:8px;font-size:11px;font-weight:700}.practice-btn{background:#fff;border-color:var(--line);color:var(--ink)}.nav{position:sticky;bottom:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);display:flex;justify-content:space-around;margin:26px -18px -30px;padding:12px 8px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav a{font-size:11px;color:var(--muted);text-decoration:none;text-align:center}.nav a.active{color:var(--blue);font-weight:700}.nav i{display:block;font-style:normal;font-size:19px;margin-bottom:3px}
</style></head>
<body><main class="phone">
<header class="top"><div class="logo">声調<span>コーチ</span> <small style="font-size:10px;color:#16a37b">DEMO 2</small></div><div class="avatar">A</div></header>
<section class="hero"><p class="eyebrow">日本人のための中国語発音トレーニング</p><h1>中国語、<em>通じる発音</em>へ。</h1><p>日本人が間違いやすい声調を、聞いて、当てて、話して身につけましょう。</p></section>
<section class="streak"><div class="fire">🔥</div><div><b>今日の3分チャレンジ</b><small>まずは5問。耳から声調を鍛えよう</small></div></section>
<div class="section-head"><h2>👂 聞き分けチャレンジ</h2><span id="gameCount">1 / 5</span></div>
<section class="game" id="game"><div class="game-top"><span class="tag">音だけで判断</span><span class="progress" id="gameProgress">○ ○ ○ ○ ○</span></div><div id="gameBody"><div class="game-title">音声を聞いて、意味を選ぼう</div><div class="game-sub">漢字は答えたあとに表示されます</div><button class="play-big" onclick="playGameSound()">🔊 音声を聞く</button><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="game-actions" id="gameActions"><button class="btn listen" onclick="playGameSound()">🔊 もう一度</button><button class="btn next" onclick="nextGame()">次の問題 →</button></div></div></section>
<div class="section-head"><h2>🎙 発音チャレンジ</h2><span id="challengeCounter">1 / 5</span></div>
<section class="challenge"><div class="challenge-top"><span class="tag">日本人が間違いやすい</span><span class="progress" id="progressText">● ○ ○ ○ ○</span></div><div class="challenge-title">この言葉を発音してみよう</div><div class="big-cn" id="challengeCN">买</div><div class="big-pinyin" id="challengePinyin">mǎi · 3声</div><div class="big-jp" id="challengeJP">買う</div><div class="tip" id="challengeTip"></div><div class="actions"><button class="btn listen" onclick="listenCurrent()">🔊 標準音声</button><button class="btn record" id="recordBtn" onclick="toggleRecording()">🎙 録音する</button></div><div id="audioArea"></div><div class="status" id="status"></div><button class="btn next" style="width:100%;margin-top:10px" onclick="nextChallenge()">次の問題 →</button></section>
<div class="section-head"><h2>基本例文20</h2><span>自由練習</span></div><section class="examples" id="examples"></section>
<nav class="nav"><a class="active" href="#" onclick="return false"><i>⌂</i>ホーム</a><a href="#game" onclick="return false"><i>◉</i>練習</a><a href="#" onclick="return false"><i>▣</i>記録</a><a href="#" onclick="return false"><i>⚙</i>設定</a></nav>
</main>
<script>
const challenges=[
{cn:'买',pinyin:'mǎi · 3声',jp:'買う',tip:'💡 3声：低く下げてから、最後を少し上げます。',tones:'买（3声）'},
{cn:'卖',pinyin:'mài · 4声',jp:'売る',tip:'⚠️ 4声は高い位置から一気に下げます。',tones:'卖（4声）'},
{cn:'水',pinyin:'shuǐ · 3声',jp:'水',tip:'💡 3声。低い位置をしっかり意識しましょう。',tones:'水（3声）'},
{cn:'睡',pinyin:'shuì · 4声',jp:'寝る',tip:'😴 「水」と似ていますが4声。一気に下げます。',tones:'睡（4声）'},
{cn:'你好',pinyin:'nǐ hǎo · 3声＋3声',jp:'こんにちは',tip:'💡 3声＋3声では、前の音が2声のように変化します。',tones:'你（3声→2声に変化）→ 好（3声）'}];
const games=[
{sound:'买',answer:0,choices:['🛒 買う','🏷️ 売る'],explain:'买 mǎi（3声）＝買う。低く下げてから少し上げます。'},
{sound:'卖',answer:1,choices:['🛒 買う','🏷️ 売る'],explain:'卖 mài（4声）＝売る。高い位置から一気に下げます。'},
{sound:'水',answer:0,choices:['💧 水','😴 寝る'],explain:'水 shuǐ（3声）＝水。低い3声を意識します。'},
{sound:'睡',answer:1,choices:['💧 水','😴 寝る'],explain:'睡 shuì（4声）＝寝る。「水」と声調が違います。'},
{sound:'问',answer:0,choices:['❓ 尋ねる','💋 キスする'],explain:'问 wèn（4声）＝尋ねる。吻 wěn（3声）とは声調が違います。'}];
const examples=[['こんにちは。','あいさつ','你好！','nǐ hǎo'],['お元気ですか？','あいさつ','你好吗？','nǐ hǎo ma'],['私は日本人です。','自己紹介','我是日本人。','wǒ shì Rìběn rén'],['私の名前は橋本太郎です。','自己紹介','我叫桥本太郎。','wǒ jiào Qiáoběn Tàiláng'],['初めまして。','あいさつ','初次见面。','chūcì jiànmiàn'],['よろしくお願いします。','あいさつ','请多关照。','qǐng duō guānzhào'],['ありがとうございます。','基本表現','谢谢你。','xièxie nǐ'],['どういたしまして。','基本表現','不客气。','bú kèqi'],['すみません。','基本表現','对不起。','duìbuqǐ'],['大丈夫です。','基本表現','没关系。','méi guānxi'],['これは何ですか？','質問','这是什么？','zhè shì shénme'],['これはいくらですか？','買い物','这个多少钱？','zhège duōshao qián'],['これをください。','買い物','请给我这个。','qǐng gěi wǒ zhège'],['トイレはどこですか？','旅行','洗手间在哪里？','xǐshǒujiān zài nǎlǐ'],['駅はどこですか？','旅行','车站在哪里？','chēzhàn zài nǎlǐ'],['水を一杯ください。','レストラン','请给我一杯水。','qǐng gěi wǒ yì bēi shuǐ'],['これは辛いですか？','レストラン','这个辣吗？','zhège là ma'],['中国語を勉強しています。','学習','我在学习中文。','wǒ zài xuéxí Zhōngwén'],['中国語は難しいですが、面白いです。','学習','中文很难，但是很有意思。','Zhōngwén hěn nán, dànshì hěn yǒu yìsi'],['また明日会いましょう。','あいさつ','明天见。','míngtiān jiàn']];
let chineseVoice=null;function refreshVoices(){if(!('speechSynthesis'in window))return;const v=speechSynthesis.getVoices();chineseVoice=v.find(x=>/^zh-CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}if('speechSynthesis'in window){refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices}function speak(t){if(!('speechSynthesis'in window)){alert('この端末では音声再生を利用できません。');return}speechSynthesis.cancel();refreshVoices();const u=new SpeechSynthesisUtterance(t);u.lang=chineseVoice?chineseVoice.lang:'zh-CN';if(chineseVoice)u.voice=chineseVoice;u.rate=.78;u.pitch=1;speechSynthesis.speak(u)}
let gameIndex=0,score=0,answered=false;function renderGame(){answered=false;document.getElementById('gameCount').textContent=(gameIndex+1)+' / '+games.length;document.getElementById('gameProgress').textContent=games.map((_,i)=>i<gameIndex?'●':'○').join(' ');const c=document.getElementById('choices');c.innerHTML='';games[gameIndex].choices.forEach((x,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>answerGame(i);c.appendChild(b)});document.getElementById('feedback').className='feedback';document.getElementById('feedback').innerHTML='';document.getElementById('gameActions').className='game-actions'}function playGameSound(){speak(games[gameIndex].sound)}function answerGame(i){if(answered)return;answered=true;const g=games[gameIndex],ok=i===g.answer;if(ok)score++;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);const f=document.getElementById('feedback');f.className='feedback show '+(ok?'good':'bad');f.innerHTML='<b>'+(ok?'🎉 正解！':'惜しい！')+'</b><br><strong>'+g.sound+'</strong> — '+g.explain;document.getElementById('gameActions').className='game-actions show'}function nextGame(){if(gameIndex<games.length-1){gameIndex++;renderGame();playGameSound()}else{document.getElementById('gameBody').innerHTML='<div class="score"><div>5問終了 🎉</div><strong>'+score+' / 5</strong><p>'+(score===5?'すばらしい！声調の違いをよく聞き分けられています。':score>=3?'いい感じです。間違えた音をもう一度聞いてみましょう。':'まずは「3声」と「4声」の違いから繰り返してみましょう。')+'</p><button class="play-big" onclick="restartGame()">もう一度チャレンジ</button></div>';document.getElementById('gameProgress').textContent='● ● ● ● ●';document.getElementById('gameCount').textContent='完了'}}function restartGame(){gameIndex=0;score=0;document.getElementById('gameBody').innerHTML='<div class="game-title">音声を聞いて、意味を選ぼう</div><div class="game-sub">漢字は答えたあとに表示されます</div><button class="play-big" onclick="playGameSound()">🔊 音声を聞く</button><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="game-actions" id="gameActions"><button class="btn listen" onclick="playGameSound()">🔊 もう一度</button><button class="btn next" onclick="nextGame()">次の問題 →</button></div>';renderGame()}
let currentChallenge=0,customPractice=null;function renderChallenge(){const x=challenges[currentChallenge];challengeCN.textContent=x.cn;challengePinyin.textContent=x.pinyin;challengeJP.textContent=x.jp;challengeTip.textContent=x.tip;challengeCounter.textContent=(currentChallenge+1)+' / '+challenges.length;progressText.textContent=challenges.map((_,i)=>i<=currentChallenge?'●':'○').join(' ');clearRecording();status.className='status';status.innerHTML=''}function nextChallenge(){if(isRecording){stopRecording();return}customPractice=null;currentChallenge=(currentChallenge+1)%challenges.length;renderChallenge()}function getPracticeText(){return customPractice?customPractice.cn:challenges[currentChallenge].cn}function listenCurrent(){speak(getPracticeText())}
const examplesBox=document.getElementById('examples');examples.forEach((x,i)=>{const card=document.createElement('article');card.className='example';card.innerHTML='<div class="example-top"><div class="jp">'+x[0]+'</div><span class="level">'+x[1]+'</span></div><div class="cn">'+x[2]+'</div><div class="pinyin">'+x[3]+'</div><div class="example-buttons"><button class="small-btn" onclick="speak(examples['+i+'][2])">🔊 聞く</button><button class="small-btn practice-btn" onclick="practiceExample('+i+')">🎙 練習</button></div>';examplesBox.appendChild(card)});function practiceExample(i){const x=examples[i];customPractice={cn:x[2]};challengeCN.textContent=x[2];challengePinyin.textContent=x[3];challengeJP.textContent=x[0];challengeTip.textContent='🎧 標準音声を聞いてから、同じリズムで発音してみましょう。';clearRecording();status.className='status info show';status.innerHTML='<b>例文練習モード</b><br>標準音声 → 録音 → 聞き比べ の順で練習しましょう。';document.querySelector('.challenge').scrollIntoView({behavior:'smooth',block:'center'})}
let mediaRecorder=null,microphoneStream=null,chunks=[],recordedURL=null,isRecording=false,starting=false,autoStopTimer=null;function clearRecording(){audioArea.innerHTML='';if(recordedURL){URL.revokeObjectURL(recordedURL);recordedURL=null}}function releaseMicrophone(){if(microphoneStream){microphoneStream.getTracks().forEach(t=>{try{t.stop()}catch(e){}});microphoneStream=null}}async function toggleRecording(){if(isRecording){stopRecording();return}if(starting)return;await startRecording()}async function startRecording(){const btn=recordBtn;if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){status.className='status info show';status.textContent='このブラウザでは録音機能を利用できません。';return}starting=true;btn.disabled=true;btn.textContent='🎙 準備中…';try{if('speechSynthesis'in window)speechSynthesis.cancel();releaseMicrophone();clearRecording();const stream=await navigator.mediaDevices.getUserMedia({audio:true});microphoneStream=stream;chunks=[];const recorder=new MediaRecorder(stream);mediaRecorder=recorder;recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onerror=()=>{isRecording=false;starting=false;releaseMicrophone();btn.disabled=false;btn.classList.remove('recording');btn.textContent='🎙 もう一度';status.className='status info show';status.textContent='録音エラーが発生しました。もう一度お試しください。'};recorder.onstop=()=>{isRecording=false;if(autoStopTimer){clearTimeout(autoStopTimer);autoStopTimer=null}releaseMicrophone();btn.disabled=false;btn.classList.remove('recording');btn.textContent='🎙 もう一度録音';if(!chunks.length){status.className='status info show';status.textContent='録音データを取得できませんでした。';return}const type=recorder.mimeType||chunks[0].type||'audio/mp4',blob=new Blob(chunks,{type});if(!blob.size)return;recordedURL=URL.createObjectURL(blob);const a=document.createElement('audio');a.controls=true;a.preload='metadata';a.src=recordedURL;audioArea.appendChild(a);const hint=customPractice?'標準音声と、自分のリズム・高さを比べてみましょう。':'声調：'+challenges[currentChallenge].tones;status.className='status ok show';status.innerHTML='<b>✓ 録音できました！</b><br>自分の声を再生して、標準音声と聞き比べてみましょう。<br>'+hint};recorder.start();isRecording=true;starting=false;btn.disabled=false;btn.classList.add('recording');btn.textContent='■ 録音を停止';status.className='status info show';status.innerHTML='<b>● 録音中…</b><br>「'+getPracticeText()+'」と発音してみましょう。';autoStopTimer=setTimeout(()=>{if(mediaRecorder===recorder&&recorder.state==='recording')stopRecording()},10000)}catch(e){starting=false;isRecording=false;releaseMicrophone();btn.disabled=false;btn.classList.remove('recording');btn.textContent='🎙 録音する';status.className='status info show';status.innerHTML='<b>マイクを開始できませんでした。</b><br>Safariのマイク許可を確認して、もう一度お試しください。'}}function stopRecording(){if(autoStopTimer){clearTimeout(autoStopTimer);autoStopTimer=null}if(mediaRecorder&&mediaRecorder.state==='recording'){try{mediaRecorder.stop()}catch(e){releaseMicrophone();isRecording=false;mediaRecorder=null}}else{releaseMicrophone();isRecording=false}}window.addEventListener('pagehide',()=>{if(autoStopTimer)clearTimeout(autoStopTimer);releaseMicrophone();if(recordedURL)URL.revokeObjectURL(recordedURL)});renderGame();renderChallenge();
</script></body></html>
